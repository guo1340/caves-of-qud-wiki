<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Tile-map Caves of Qud archive scene with ruins, desert, plants and chrome machinery">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05100d"/>
      <stop offset=".38" stop-color="#0f2a22"/>
      <stop offset=".72" stop-color="#3d3421"/>
      <stop offset="1" stop-color="#07110e"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="62%" cy="38%" r="50%">
      <stop offset="0" stop-color="#6fffe2" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#6fffe2" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6fffe2" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .2"/></feComponentTransfer>
    </filter>
    <pattern id="tiles" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="none" stroke="#6fffe2" stroke-opacity=".12" stroke-width="2"/>
      <rect x="2" y="2" width="8" height="8" fill="#b6ff52" opacity=".13"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#screenGlow)"/>
  <rect width="1600" height="900" fill="url(#tiles)" opacity=".72"/>

  <g opacity=".55">
    <path d="M0 610c190-92 370-114 548-67 164 43 302 22 476-58 226-104 404-76 576 18v397H0z" fill="#10241d"/>
    <path d="M0 720c220-78 448-86 690-34 330 70 606 22 910-72v286H0z" fill="#07110e"/>
  </g>

  <g transform="translate(910 180)">
    <rect x="0" y="0" width="360" height="302" fill="#06100d" stroke="#6fffe2" stroke-width="10"/>
    <rect x="24" y="24" width="312" height="254" fill="#0b1713" stroke="#3a755e" stroke-width="4"/>
    <g font-family="monospace" font-size="22" fill="#b6ff52">
      <text x="48" y="72">LIVE AND DRINK</text>
      <text x="48" y="114">MUTATION INDEX: WARM</text>
      <text x="48" y="156">WATER RITUAL: READY</text>
      <text x="48" y="198">SALT DUNE MAP: FOUND</text>
    </g>
    <circle cx="292" cy="220" r="28" fill="#6fffe2" opacity=".22"/>
    <path d="M278 220h28M292 206v28" stroke="#ffd166" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g transform="translate(355 398)" fill="none" stroke="#ffd166" stroke-width="10" stroke-linecap="square" stroke-linejoin="round">
    <path d="M0 264V86l84-62 84 62v178"/>
    <path d="M32 112h104M32 156h104M32 200h104"/>
    <path d="M-68 264h304"/>
    <path d="M84 24v240"/>
  </g>

  <g transform="translate(660 620)">
    <rect x="-28" y="-132" width="56" height="132" fill="#3a755e"/>
    <circle cx="0" cy="-158" r="52" fill="#b6ff52" opacity=".78"/>
    <path d="M-78-92c54-22 102-18 156 0" fill="none" stroke="#b6ff52" stroke-width="16" stroke-linecap="round"/>
    <path d="M-54-38c40-18 72-18 108 0" fill="none" stroke="#55c7ff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-18" cy="-166" r="8" fill="#07110e"/>
    <circle cx="18" cy="-166" r="8" fill="#07110e"/>
  </g>

  <g transform="translate(1140 590)">
    <path d="M0 0h230l-28 96H28z" fill="#163329" stroke="#6fffe2" stroke-width="8"/>
    <path d="M64 96h102l22 86H42z" fill="#07110e" stroke="#3a755e" stroke-width="8"/>
    <path d="M42 28h160M34 62h178" stroke="#ffd166" stroke-width="7" opacity=".9"/>
    <circle cx="196" cy="-10" r="34" fill="#f06cff" opacity=".28"/>
  </g>

  <g transform="translate(240 690)">
    <rect x="0" y="0" width="84" height="84" fill="#d7b86b"/>
    <rect x="88" y="44" width="84" height="84" fill="#d66a4a"/>
    <rect x="-88" y="44" width="84" height="84" fill="#55c7ff"/>
    <rect x="22" y="-70" width="42" height="70" fill="#3a755e"/>
    <path d="M-110 130h310" stroke="#6fffe2" stroke-width="6" opacity=".4"/>
  </g>

  <g transform="translate(500 710)" font-family="monospace" font-size="30" font-weight="700">
    <text x="0" y="0" fill="#6fffe2">@</text>
    <text x="55" y="-48" fill="#ffd166">#</text>
    <text x="105" y="18" fill="#b6ff52">*</text>
    <text x="160" y="-22" fill="#f06cff">&amp;</text>
    <text x="212" y="16" fill="#55c7ff">?</text>
  </g>

  <g opacity=".5" font-family="monospace" font-size="24" fill="#6fffe2">
    <text x="82" y="118">01001100 LIVE</text>
    <text x="82" y="150">00100110 DRINK</text>
    <text x="1220" y="126">CHROME IDOL ONLINE</text>
    <text x="1220" y="158">REPUTATION MATRIX</text>
  </g>

  <g fill="#07110e" stroke="#3a755e" stroke-width="6">
    <path d="M88 734h104v92H88zM112 682h56v52h-56z"/>
    <path d="M1394 700h112v102h-112zM1418 648h64v52h-64z"/>
  </g>

  <rect width="1600" height="900" filter="url(#grain)" opacity=".48"/>
</svg>
